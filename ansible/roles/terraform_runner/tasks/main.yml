# Maintainer: Leandro Michelino | ACE | leandro.michelino@oracle.com
---
- name: Normalize Terraform runner inputs
  ansible.builtin.set_fact:
    terraform_action_normalized: "{{ terraform_action | lower }}"
    terraform_landingzone_environment: "{{ landingzone_environment | default('dev') | lower }}"
    terraform_var_file_candidate: >-
      {{
        terraform_var_file |
        default(
          (terraform_environment_dir ~ '/terraform.tfvars')
          if (terraform_environment_dir | default('') | length > 0)
          else '',
          true
        )
      }}

- name: Validate Terraform action
  ansible.builtin.assert:
    that:
      - terraform_action_normalized in ["plan", "apply", "destroy"]
    fail_msg: "terraform_action must be one of: plan, apply, destroy."

- name: Block production Terraform changes from Ansible
  ansible.builtin.assert:
    that:
      - terraform_landingzone_environment != "prod"
    fail_msg: "Production Terraform apply/destroy is blocked from Ansible for now."
  when:
    - terraform_block_production_changes | bool
    - terraform_action_normalized in ["apply", "destroy"]

- name: Require explicit apply confirmation
  ansible.builtin.assert:
    that:
      - lookup('env', 'CONFIRM_APPLY') == "true"
    fail_msg: "Refusing Terraform apply without CONFIRM_APPLY=true."
  when: terraform_action_normalized == "apply"

- name: Require explicit destroy confirmation
  ansible.builtin.assert:
    that:
      - lookup('env', 'CONFIRM_DESTROY') == "true"
    fail_msg: "Refusing Terraform destroy without CONFIRM_DESTROY=true."
  when: terraform_action_normalized == "destroy"

- name: Check optional Terraform variable file
  ansible.builtin.stat:
    path: "{{ terraform_var_file_candidate }}"
  register: terraform_var_file_status
  when: terraform_var_file_candidate | length > 0

- name: Require Terraform variable file when configured
  ansible.builtin.assert:
    that:
      - terraform_var_file_candidate | length > 0
      - terraform_var_file_status is defined
      - terraform_var_file_status.stat.exists | default(false)
    fail_msg: "Terraform variable file was required but not found."
  when: terraform_require_var_file | bool

- name: Build Terraform variable file arguments
  ansible.builtin.set_fact:
    terraform_var_file_args: >-
      {{
        (
          terraform_var_file_candidate | length > 0 and
          terraform_var_file_status.stat.exists | default(false)
        ) | ternary(['-var-file=' ~ terraform_var_file_candidate], [])
      }}

- name: Prepare Terraform plugin cache
  ansible.builtin.file:
    path: "{{ terraform_plugin_cache_dir }}"
    state: directory
    mode: "0755"

- name: Terraform init with backend
  ansible.builtin.command:
    argv:
      - terraform
      - init
      - -input=false
      - -no-color
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: false
  environment: "{{ terraform_command_environment }}"
  when: terraform_backend_enabled | bool

- name: Terraform init without backend
  ansible.builtin.command:
    argv:
      - terraform
      - init
      - -backend=false
      - -input=false
      - -no-color
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: false
  environment: "{{ terraform_command_environment }}"
  when: not terraform_backend_enabled | bool

- name: Terraform validate
  ansible.builtin.command: terraform validate -no-color
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: false
  environment: "{{ terraform_command_environment }}"

- name: Terraform plan
  ansible.builtin.command:
    argv: >-
      {{
        ['terraform', 'plan', '-input=false', '-no-color'] +
        terraform_var_file_args +
        ['-out=' ~ terraform_plan_file]
      }}
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: false
  environment: "{{ terraform_command_environment }}"
  when:
    - terraform_run_plan | bool
    - terraform_action_normalized in ["plan", "apply"]

- name: Terraform apply approved plan
  ansible.builtin.command:
    argv:
      - terraform
      - apply
      - -input=false
      - -no-color
      - "{{ terraform_plan_file }}"
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: true
  environment: "{{ terraform_command_environment }}"
  when: terraform_action_normalized == "apply"

- name: Read Terraform outputs for operator summary
  ansible.builtin.command: terraform output -json
  args:
    chdir: "{{ terraform_working_dir }}"
  register: terraform_output_json
  changed_when: false
  failed_when: false
  environment: "{{ terraform_command_environment }}"
  when: terraform_action_normalized in ["plan", "apply"]

- name: Parse Terraform outputs for operator summary
  ansible.builtin.set_fact:
    terraform_outputs_parsed: "{{ terraform_output_json.stdout | from_json }}"
  when:
    - terraform_action_normalized in ["plan", "apply"]
    - terraform_output_json.rc == 0
    - terraform_output_json.stdout | trim | length > 0
    - terraform_output_json.stdout | trim is search('^{')

- name: Show friendly Terraform operator summary
  ansible.builtin.debug:
    msg:
      - "Terraform {{ terraform_action_normalized }} completed for {{ terraform_working_dir }}."
      - "Blueprint: {{ terraform_outputs_parsed.blueprint_name.value | default('not available yet') }}"
      - "Name prefix: {{ terraform_outputs_parsed.name_prefix.value | default('not available yet') }}"
      - "Primary cluster: {{ terraform_outputs_parsed.primary_cluster.value | default({}) | to_nice_json }}"
      - "Secondary cluster: {{ terraform_outputs_parsed.secondary_cluster.value | default({}) | to_nice_json }}"
      - "Kubernetes: {{ terraform_outputs_parsed.operator_summary.value.kubernetes | default({}) | to_nice_json }}"
      - "Application endpoints: {{ terraform_outputs_parsed.operator_summary.value.application_endpoints | default({}) | to_nice_json }}"
      - "Traffic management: {{ terraform_outputs_parsed.operator_summary.value.traffic_management | default({}) | to_nice_json }}"
      - "Resource names: {{ terraform_outputs_parsed.operator_summary.value.resource_names | default({}) | to_nice_json }}"
      - "Resource IDs: {{ terraform_outputs_parsed.resource_ids.value | default({}) | to_nice_json }}"
      - "Useful commands: {{ terraform_outputs_parsed.operator_summary.value.useful_commands | default({}) | to_nice_json }}"
  when:
    - terraform_action_normalized in ["plan", "apply"]
    - terraform_outputs_parsed is defined

- name: Terraform destroy
  ansible.builtin.command:
    argv: >-
      {{
        ['terraform', 'destroy', '-auto-approve', '-input=false', '-no-color'] +
        terraform_var_file_args
      }}
  args:
    chdir: "{{ terraform_working_dir }}"
  changed_when: true
  environment: "{{ terraform_command_environment }}"
  when: terraform_action_normalized == "destroy"

- name: Show friendly Terraform destroy summary
  ansible.builtin.debug:
    msg:
      - "Terraform destroy completed for {{ terraform_working_dir }}."
      - "State resources owned by this run were destroyed or destroy was idempotent."
      - "Run 'terraform state list' in the blueprint folder to confirm no managed resources remain."
  when: terraform_action_normalized == "destroy"
