# Maintainer: Leandro Michelino | ACE | leandro.michelino@oracle.com
---
- name: Normalize Azure deployment action
  ansible.builtin.set_fact:
    azure_action_normalized: "{{ azure_action | lower }}"

- name: Validate Azure deployment action
  ansible.builtin.assert:
    that:
      - azure_action_normalized in ["plan", "apply", "destroy"]
    fail_msg: "azure_action must be one of: plan, apply, destroy."

- name: Require explicit Azure apply confirmation
  ansible.builtin.assert:
    that:
      - lookup('env', 'CONFIRM_AZURE_APPLY') == 'true'
    fail_msg: "Refusing Azure apply without CONFIRM_AZURE_APPLY=true."
  when: azure_action_normalized == "apply"

- name: Require explicit Azure destroy confirmation
  ansible.builtin.assert:
    that:
      - lookup('env', 'CONFIRM_AZURE_DESTROY') == 'true'
    fail_msg: "Refusing Azure destroy without CONFIRM_AZURE_DESTROY=true."
  when: azure_action_normalized == "destroy"

- name: Validate Azure CLI availability
  ansible.builtin.command: az version
  changed_when: false

- name: Validate Azure CLI login context
  ansible.builtin.command: az account show
  changed_when: false

- name: Ensure Azure parameters file exists
  ansible.builtin.stat:
    path: "{{ azure_parameters_file }}"
  register: azure_parameters_status
  when: azure_action_normalized in ["plan", "apply"]

- name: Fail when Azure parameters file is missing
  ansible.builtin.assert:
    that:
      - azure_parameters_status.stat.exists
    fail_msg: "Azure parameters file not found: {{ azure_parameters_file }}"
  when: azure_action_normalized in ["plan", "apply"]

- name: Ensure Azure resource group exists
  ansible.builtin.command:
    argv:
      - az
      - group
      - create
      - --name
      - "{{ azure_resource_group }}"
      - --location
      - "{{ azure_location }}"
  changed_when: false
  when: azure_action_normalized in ["plan", "apply"]

- name: Run Azure what-if
  ansible.builtin.command:
    argv:
      - az
      - deployment
      - group
      - what-if
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ azure_deployment_name }}"
      - --template-file
      - "{{ azure_template_file }}"
      - --parameters
      - "@{{ azure_parameters_file }}"
      - --result-format
      - ResourceIdOnly
  register: azure_plan_result
  changed_when: false
  when: azure_action_normalized == "plan"

- name: Summarize Azure plan output
  ansible.builtin.debug:
    msg:
      - "Azure what-if completed for deployment {{ azure_deployment_name }} in resource group {{ azure_resource_group }}."
      - "Mode: planning only (no resources created by this step)."
      - "What-if output lines: {{ azure_plan_result.stdout_lines | default([]) | length }}."
  when: azure_action_normalized == "plan"

- name: Apply Azure deployment
  ansible.builtin.command:
    argv:
      - az
      - deployment
      - group
      - create
      - --resource-group
      - "{{ azure_resource_group }}"
      - --name
      - "{{ azure_deployment_name }}"
      - --template-file
      - "{{ azure_template_file }}"
      - --parameters
      - "@{{ azure_parameters_file }}"
      - --query
      - properties.outputs
      - --output
      - json
  register: azure_apply_outputs
  changed_when: true
  when: azure_action_normalized == "apply"

- name: Show Azure deployment outputs
  ansible.builtin.set_fact:
    azure_apply_outputs_parsed: "{{ azure_apply_outputs.stdout | from_json }}"
  when: azure_action_normalized == "apply"

- name: Summarize Azure deployment outputs
  ansible.builtin.debug:
    msg:
      - "Azure apply completed for deployment {{ azure_deployment_name }} in resource group {{ azure_resource_group }}."
      - "Returned output keys: {{ azure_apply_outputs_parsed.keys() | list | length }}."
      - "Outputs (JSON): {{ azure_apply_outputs_parsed | to_nice_json }}"
  when: azure_action_normalized == "apply"

- name: Delete Azure resource group
  ansible.builtin.command:
    argv:
      - az
      - group
      - delete
      - --name
      - "{{ azure_resource_group }}"
      - --yes
      - --no-wait
  changed_when: true
  when: azure_action_normalized == "destroy"

- name: Wait for Azure resource group deletion completion
  ansible.builtin.command:
    argv:
      - az
      - group
      - wait
      - --deleted
      - --name
      - "{{ azure_resource_group }}"
  register: azure_destroy_wait
  changed_when: false
  failed_when: false
  when: azure_action_normalized == "destroy"

- name: Confirm Azure deletion request accepted
  ansible.builtin.debug:
    msg:
      - "Azure destroy completed for resource group {{ azure_resource_group }}."
      - >-
        {{
          ((azure_destroy_wait.rc | default(1)) == 0)
          | ternary(
            'Azure CLI wait confirmed resource-group deletion.',
            'Azure CLI wait did not confirm completion; verify resource-group status manually.'
          )
        }}
  when: azure_action_normalized == "destroy"
