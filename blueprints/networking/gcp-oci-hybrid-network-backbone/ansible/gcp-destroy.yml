---
- name: destroy GCP and OCI Hybrid Network Backbone GCP
  hosts: localhost
  gather_facts: false
  vars:
    terraform_action: destroy
    terraform_backend_enabled: false
    terraform_working_dir: "{{ playbook_dir }}/../gcp"
  tasks:
    - name: Run shared Terraform runner
      ansible.builtin.import_role:
        name: ../../../../ansible/roles/terraform_runner
