# Maintainer: Leandro Michelino | ACE | leandro.michelino@oracle.com
AWSTemplateFormatVersion: '2010-09-09'
Description: AWS EKS secondary cluster for OCI-primary EKS + OKE active-active blueprint.

Parameters:
  EKSClusterName:
    Type: String
    Default: eks-oci-secondary
  NodeGroupName:
    Type: String
    Default: system
  KubernetesVersion:
    Type: String
    Default: '1.31'
  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeCount:
    Type: Number
    Default: 2
  VpcCidr:
    Type: String
    Default: 10.64.0.0/16
  SubnetOneCidr:
    Type: String
    Default: 10.64.10.0/24
  SubnetTwoCidr:
    Type: String
    Default: 10.64.20.0/24
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0

Resources:
  EksVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc-eks-secondary'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw-eks-secondary'

  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref EksVpc
      InternetGatewayId: !Ref InternetGateway

  EksRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EksVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rt-eks-secondary'

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref EksRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  EksSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: !Ref SubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sn-eks-secondary-a'

  EksSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: !Ref SubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sn-eks-secondary-b'

  EksSubnetRouteAssociationOne:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnetOne
      RouteTableId: !Ref EksRouteTable

  EksSubnetRouteAssociationTwo:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnetTwo
      RouteTableId: !Ref EksRouteTable

  EksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS secondary cluster traffic.
      VpcId: !Ref EksVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg-eks-secondary'

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref EKSClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        EndpointPublicAccess: true
        EndpointPrivateAccess: false
        SecurityGroupIds:
          - !Ref EksSecurityGroup
        SubnetIds:
          - !Ref EksSubnetOne
          - !Ref EksSubnetTwo

  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EKSClusterName
      NodegroupName: !Ref NodeGroupName
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !Ref EksSubnetOne
        - !Ref EksSubnetTwo
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeCount
        MinSize: 1
        MaxSize: 4

Outputs:
  EksClusterArn:
    Description: EKS cluster ARN.
    Value: !GetAtt EksCluster.Arn
  EksClusterName:
    Description: EKS cluster name.
    Value: !Ref EKSClusterName
  EksClusterEndpoint:
    Description: EKS API endpoint URL.
    Value: !GetAtt EksCluster.Endpoint
  EksNodeGroupArn:
    Description: EKS node group ARN.
    Value: !GetAtt EksNodeGroup.Arn
  EksVpcId:
    Description: EKS VPC ID.
    Value: !Ref EksVpc
  EksSubnetOneId:
    Description: EKS subnet A ID.
    Value: !Ref EksSubnetOne
  EksSubnetTwoId:
    Description: EKS subnet B ID.
    Value: !Ref EksSubnetTwo
  EksRouteTableId:
    Description: EKS route table ID.
    Value: !Ref EksRouteTable
  EksSecurityGroupId:
    Description: EKS security group ID.
    Value: !Ref EksSecurityGroup
