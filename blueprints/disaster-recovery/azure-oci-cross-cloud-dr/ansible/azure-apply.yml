---
- name: Azure apply session for DR standby deployment
  hosts: localhost
  gather_facts: false
  vars:
    azure_resource_group: "{{ lookup('env', 'AZURE_DR_RESOURCE_GROUP') | default('rg-oci-azure-dr-standby-dev', true) }}"
    azure_location: "{{ lookup('env', 'AZURE_DR_LOCATION') | default('westeurope', true) }}"
    azure_deployment_name: "{{ lookup('env', 'AZURE_DR_DEPLOYMENT_NAME') | default('oci-azure-dr-standby-apply', true) }}"
    azure_template_file: "{{ playbook_dir }}/../azure/main.bicep"
    azure_parameters_file: "{{ lookup('env', 'AZURE_DR_PARAMETERS_FILE') | default(playbook_dir ~ '/../azure/parameters.example.json', true) }}"
  tasks:
    - name: Require explicit Azure apply confirmation
      ansible.builtin.assert:
        that:
          - lookup('env', 'CONFIRM_AZURE_APPLY') == 'true'
        fail_msg: "Refusing Azure apply without CONFIRM_AZURE_APPLY=true."

    - name: Validate Azure CLI availability
      ansible.builtin.command: az version
      changed_when: false

    - name: Validate Azure CLI login context
      ansible.builtin.command: az account show
      changed_when: false

    - name: Ensure DR Azure parameters file exists
      ansible.builtin.stat:
        path: "{{ azure_parameters_file }}"
      register: dr_azure_parameters

    - name: Fail when DR Azure parameters file is missing
      ansible.builtin.assert:
        that:
          - dr_azure_parameters.stat.exists
        fail_msg: "Azure parameters file not found: {{ azure_parameters_file }}"

    - name: Ensure Azure resource group exists
      ansible.builtin.command:
        argv:
          - az
          - group
          - create
          - --name
          - "{{ azure_resource_group }}"
          - --location
          - "{{ azure_location }}"
      changed_when: false

    - name: Deploy DR standby resources in Azure
      ansible.builtin.command:
        argv:
          - az
          - deployment
          - group
          - create
          - --resource-group
          - "{{ azure_resource_group }}"
          - --name
          - "{{ azure_deployment_name }}"
          - --template-file
          - "{{ azure_template_file }}"
          - --parameters
          - "@{{ azure_parameters_file }}"
          - --query
          - properties.outputs
          - --output
          - json
      register: dr_azure_outputs
      changed_when: true

    - name: Show DR deployment outputs
      ansible.builtin.debug:
        var: dr_azure_outputs.stdout
