---
- name: Azure destroy session for Azure OpenAI gateway deployment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    azure_action: destroy
    azure_resource_group: "{{ lookup('env', 'AZURE_AI_GW_RESOURCE_GROUP') | default('rg-oci-azure-ai-gw-dev', true) }}"
  tasks:
    - name: Run shared Azure deployment runner
      ansible.builtin.import_role:
        name: ../../../../ansible/roles/azure_deployment_runner
